<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gridsim</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">gridsim</div>
    <div class="stats" id="stats"></div>
  </header>
  <main>
    <button type="button" id="back" hidden>back</button>
    <canvas id="map"></canvas>
    <aside id="panel">
      <button type="button" id="panel-toggle" aria-expanded="true" aria-controls="panel-body">hide</button>
      <div id="panel-body">
        <p class="muted">Loading the fleet…</p>
      </div>
    </aside>
  </main>
  <div id="tip" hidden></div>
  <dialog id="unit" aria-labelledby="unit-id">
    <div class="unit">
      <div class="unit-head">
        <div>
          <h2 id="unit-id"></h2>
          <div class="sub" id="unit-sub"></div>
        </div>
        <div class="unit-head-end">
          <div id="unit-mode"></div>
          <button type="button" id="unit-close" aria-label="Close">close</button>
        </div>
      </div>
      <div class="unit-body">
        <div class="unit-chain">
          <div class="unit-chain-cap">one-line diagram</div>
          <div id="unit-diagram"></div>
        </div>
        <div class="unit-detail" id="unit-detail"></div>
      </div>
    </div>
  </dialog>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="/main.js"></script>
</body>
</html>
