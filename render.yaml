# Two services. The bot holds the simulation and the Supabase service-role key.
# The web service is the map. Set web/config.js API_BASE to the bot origin
# before the static site is published. See docs/deploy.md.
services:
  - type: web
    name: gridsim-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn gridsim.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/scene
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: SERVE_STATIC
        value: "0"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: LLM_URL
        sync: false
      - key: ERCOT_USERNAME
        sync: false
      - key: ERCOT_PASSWORD
        sync: false
      - key: ERCOT_SUBSCRIPTION_KEY
        sync: false
  - type: web
    name: gridsim-web
    runtime: static
    staticPublishPath: web
