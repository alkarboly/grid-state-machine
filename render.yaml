# One dynamic web service. It runs the simulation and serves the map
# from the same origin, so API_BASE stays empty and CORS is unnecessary.
# See docs/deploy.md.
services:
  - type: web
    name: gridsim
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn gridsim.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/scene
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LLM_URL
        sync: false
      - key: ERCOT_USERNAME
        sync: false
      - key: ERCOT_PASSWORD
        sync: false
      - key: ERCOT_SUBSCRIPTION_KEY
        sync: false
