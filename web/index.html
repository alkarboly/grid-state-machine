<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gridsim</title>
  <link rel="stylesheet" href="/style.css?v=20">
</head>
<body>
  <header>
    <div class="brand-row">
      <div class="brand">gridsim</div>
      <nav class="nav" aria-label="Views">
        <button type="button" id="tab-fleet" class="on" data-view="fleet">fleet</button>
        <button type="button" id="tab-arch" data-view="architecture">architecture</button>
      </nav>
    </div>
    <div class="stats" id="stats"></div>
    <div class="clock" id="clock">sim <b>—</b></div>
  </header>
  <main>
    <button type="button" id="back" hidden>back</button>
    <div id="day" aria-label="24 hour demand and price"></div>
    <div id="stage" hidden>
      <p class="stage-kicker">service area</p>
      <h2 id="stage-title"></h2>
      <p id="stage-sub"></p>
      <p id="stage-counts"></p>
    </div>
    <canvas id="map"></canvas>
    <section id="arch">
      <p class="stage-kicker">architecture</p>
      <p id="arch-role"></p>
      <div id="arch-diagram"></div>
    </section>
    <aside id="panel">
      <button type="button" id="panel-toggle" aria-expanded="true" aria-controls="panel-body">hide</button>
      <div id="panel-body">
        <p class="muted">Loading the fleet…</p>
      </div>
      <div id="decisions" aria-label="Decisions">
        <p class="stage-kicker">decisions</p>
        <div id="decision-log"></div>
      </div>
    </aside>
  </main>
  <div id="tip" hidden></div>
  <dialog id="unit" aria-labelledby="unit-id">
    <div class="unit">
      <div class="unit-head">
        <div>
          <h2 id="unit-id"></h2>
          <div class="sub" id="unit-sub"></div>
        </div>
        <div class="unit-head-end">
          <div id="unit-mode"></div>
          <button type="button" id="unit-close" aria-label="Close">close</button>
        </div>
      </div>
      <div class="unit-body">
        <div class="unit-chain">
          <div class="unit-chain-cap">one-line diagram</div>
          <div id="unit-diagram"></div>
        </div>
        <div class="unit-detail" id="unit-detail"></div>
      <div id="contract-tip" hidden></div>
      </div>
    </div>
  </dialog>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="/main.js?v=36"></script>
</body>
</html>
